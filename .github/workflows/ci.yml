name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The plugin ships zero runtime dependencies and the CI suite has none
      # either, so there is deliberately no install step here. If one ever
      # becomes necessary, `npm ci` at the repo root is the place for it.

      - name: Validate manifests
        run: node scripts/ci/validate-manifest.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Scan for personal paths and secrets
        run: node scripts/ci/validate-no-personal-paths.js

      - name: Smoke-test hooks against fixtures
        run: node scripts/ci/smoke-hooks.js

      # These two need the Claude Code CLI and both exit 0 when it is missing,
      # so they are safe to run unconditionally. Install the CLI on the runner to
      # actually get their coverage: validate-cli-strict catches typo'd manifest
      # keys, check-token-budget catches always-on context creep.
      - name: Manifest schema (claude plugin validate --strict)
        run: node scripts/ci/validate-cli-strict.js

      - name: Always-on token budget
        run: node scripts/ci/check-token-budget.js
